/* ---------- actions ---------- */
function curDecision(){const r=route();return r.v==="d"?S.decisions.get(r.id):null}

function getDraftPath(path){const [k,f]=path.split(".");return f?(S.drafts[k]||{})[f]:S.drafts[k]}
function setDraftPath(path,val){const [k,f]=path.split(".");if(f){(S.drafts[k]=S.drafts[k]||{})[f]=val}else S.drafts[k]=val}

function autosize(el){if(CSS.supports&&CSS.supports("field-sizing","content"))return;el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px"}
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.tagName==="TEXTAREA")autosize(t);
  if(t.dataset.cond){const d=curDecision();const c=d&&S.drafts["seal-"+d.id]&&S.drafts["seal-"+d.id].conds[t.dataset.cond];const it=c&&c.items.find(i=>i.id===t.dataset.ci);if(it)it.text=t.value}
  if(t.dataset.draft){setDraftPath(t.dataset.draft,t.type==="range"?Number(t.value):t.value);if(t.type==="range"){const o=$("#s-conf-out");if(o)o.textContent=t.value+"%"}}
  if(t.dataset.nd){S.drafts.new[t.dataset.nd]=t.value}
  if(t.dataset.nopt!=null){S.drafts.new.options[+t.dataset.nopt]=t.value}
});
app.addEventListener("change",e=>{
  const t=e.target,d=curDecision();
  if(t.dataset.lockafter!=null){try{localStorage.setItem("shzgl-lockafter",String(+t.value))}catch(e){}toast("这台设备改好了");return}
  if(!d||isSealed(d))return;
  if(t.dataset.enter==="cond-add"){handle("cond-add",t);return}
  if(t.dataset.ed){
    const f=t.dataset.ed,v=f==="title"?t.value.trim():t.value;
    if(f==="title"&&!v){t.value=d.title;return}
    if(d[f]===v)return;
    const names={title:"标题",context:"情境说明",decideBy:"决定日期"};
    d[f]=v;persist(d,`修改${names[f]}`);
  }else if(t.dataset.optname){
    const o=d.options.find(o=>o.id===t.dataset.optname);const v=t.value.trim();
    if(!o||!v||o.name===v){if(o)t.value=o.name;return}
    const old=o.name;o.name=v;persist(d,`选项“${old}”改名为“${v}”`);
  }else if(t.dataset.itemtext){
    const o=d.options.find(o=>o.id===t.dataset.o);const it=o&&o.items.find(i=>i.id===t.dataset.itemtext);const v=t.value.trim();
    if(!it||!v||it.text===v){if(it)t.value=it.text;return}
    const old=it.text;it.text=v;it.updatedAt=nowISO();persist(d,`${o.name}：“${old}”改为“${v}”`);
  }
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset.enter){e.preventDefault();e.target.blur();handle(e.target.dataset.enter,e.target)}
});
app.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.tog)S.open[e.target.dataset.tog]=e.target.open},true);
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  e.preventDefault();handle(b.dataset.act,b);
});

async function handle(act,b){
  const ae=document.activeElement;if(ae&&ae!==b&&app.contains(ae)&&ae.blur)ae.blur();
  const d=curDecision();
  switch(act){
  case "n-addopt":S.drafts.new.options.push("");render();break;
  case "n-delopt":S.drafts.new.options.splice(+b.dataset.i,1);render();break;
  case "n-dim":toggleIn(S.drafts.new.dims,b.dataset.k);render();break;
  case "n-create":{
    const dr=S.drafts.new;const title=dr.title.trim();const opts=dr.options.map(s=>s.trim()).filter(Boolean);
    if(!title){toast("先写个标题");return}
    if(opts.length<2){toast("至少要两个选项，不然你在纠结什么");return}
    if(!dr.dims.length){toast("至少选一个打分维度");return}
    const at=nowISO();
    const nd={id:uid(),title,context:dr.context.trim(),decideBy:dr.decideBy||"",createdAt:at,status:"thinking",dims:[...dr.dims],
      options:opts.map(n=>({id:uid(),name:n,createdAt:at,items:[]})),interview:{},log:[]};
    delete S.drafts.new;
    persist(nd,"建档");location.hash="d-"+nd.id;break;
  }
  case "addopt":{
    const k="newopt-"+d.id;const v=(S.drafts[k]||"").trim();if(!v)return;
    d.options.push({id:uid(),name:v,createdAt:nowISO(),items:[]});S.drafts[k]="";persist(d,`新增选项“${v}”`);break;
  }
  case "delopt":{
    const o=d.options.find(o=>o.id===b.dataset.o);if(!o)return;
    if(!await ask(`删除选项“${o.name}”和它的好处坏处？`))return;
    d.options=d.options.filter(x=>x!==o);persist(d,`删除选项“${o.name}”`);break;
  }
  case "dim":toggleIn(d.dims,b.dataset.k);persist(d,`打分维度改为 ${d.dims.map(k=>DIMS[k].name).join(" × ")||"无"}`);break;
  case "additem":{
    const o=d.options.find(o=>o.id===b.dataset.o);const type=b.dataset.type;const k=`add-${o.id}-${type}`;const v=(S.drafts[k]||"").trim();if(!v)return;
    const at=nowISO();o.items.push({id:uid(),type,text:v,scores:{},createdAt:at,updatedAt:at});S.drafts[k]="";
    persist(d,`${o.name} 加${type==="pro"?"好处":"坏处"}“${v}”`);break;
  }
  case "delitem":{

function toggleIn(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}

/* ---------- interview (Claude) ---------- */
function brief(d){
  let s=`决定标题：${d.title}\n情境：${d.context||"（没写）"}\n决定日期：${d.decideBy||"没定"}\n打分维度（1-5）：${d.dims.map(k=>DIMS[k].name).join("、")}\n`;
  for(const o of d.options){
    s+=`\n选项「${o.name}」\n`;
    for(const t of ["pro","con"]){const items=o.items.filter(i=>i.type===t);s+=`  ${t==="pro"?"好处":"坏处"}：${items.length?"":"（没写）"}\n`;items.forEach(i=>{const src=findItem(d,i.mirrorOf);if(src){s+=`   - ${i.text}（和「${src.o.name}」的“${src.it.text}”是同一件事）\n`;return}s+=`   - ${i.text}${Object.keys(i.scores||{}).length?"（"+d.dims.map(k=>i.scores[k]?DIMS[k].name+i.scores[k]:"").filter(Boolean).join("，")+"）":""}\n`})}
  }
  return s;
}
function qaText(qa){return qa.filter(x=>x.a!=null||x.skipped).map((x,i)=>`Q${i+1}：${x.q}\nA：${x.skipped?"（他跳过了这题）":x.a}`).join("\n\n")}
function sampleErr(e){
  const c=e&&e.code;
  if(c==="not_granted")return"你没允许这个 app 用 Claude，这步可以跳过。";
  if(c==="rate_limited")return"Claude 额度用完了，晚点再来，或者直接跳过这步。";
  return"Claude 出错了："+(e&&e.message||"未知错误")+"。可以再按一次，或跳过这步。";
}
async function ivStart(d,act){
  const sample=await getSample();
  if(!sample){S.sample=null;render();return}
  d.interview=d.interview||{};
  if(!d.interview.startedAt){d.interview.startedAt=nowISO();d.interview.qa=[];d.interview.skipped=false;persist(d,"开始 Claude 拷问")}
  const answered=d.interview.qa.filter(x=>x.a!=null||x.skipped).length;
  if(answered>=QUESTIONS)return ivSummary(d);
  ivAsk(d);
}
async function ivAsk(d){
  const sample=await getSample();if(!sample)return;
  const key="iv-"+d.id;S.busy[key]="q";S.err[key]=null;render();
  const qa=d.interview.qa;const n=qa.length+1;
  const prompt=`你在帮一个人把一个决定想清楚。用简体中文，语气可以带点调侃、毒舌，但问题要尖锐、具体、对他有用，不要客套。

下面是他的决定资料：
${brief(d)}

${qa.length?"之前的问答：\n"+qaText(qa)+"\n\n":""}现在问第 ${n} 题（共 ${QUESTIONS} 题）。规则：
- 只问一个问题，60 个字以内，不要编号、不要前言、不要解释。
- 优先根据他上一题的回答追问，戳他回避或说不清的地方。
- 不要重复之前问过的角度。可以考虑：真正的动机、最坏情况能不能承受、机会成本、能不能回头、10 分钟/10 个月/10 年后怎么看、别人的看法对他影响多大、是恐惧还是理性在做决定、有没有漏掉的选项、好处坏处里打分可疑的地方。
- 直接输出问题本身。`;
  try{
    const r=await sample(prompt,{cache:false,onText:({text})=>{const el=$("#iv-q")||$("#iv-q2");if(el){el.classList.remove("muted");el.textContent=text}}});
    const q=(r.text||"").trim().replace(/^["“]|["”]$/g,"");
    if(!q)throw{message:"没生出问题"};
    d.interview.qa.push({q,qAt:nowISO()});S.busy[key]=null;persist(d,`Claude 问了第 ${n} 题`);
  }catch(e){S.busy[key]=null;S.err[key]=sampleErr(e);if(e&&e.code==="not_granted")S.sample=null;render()}
}
function ivAnswer(d,skip){
  const k="ans-"+d.id;const v=(S.drafts[k]||"").trim();
  if(!skip&&!v){toast("写点东西再按回答");return}
  const cur=d.interview.qa.find(x=>x.a==null&&!x.skipped);if(!cur)return;
  if(skip)cur.skipped=true;else cur.a=v;cur.aAt=nowISO();S.drafts[k]="";
  const answered=d.interview.qa.filter(x=>x.a!=null||x.skipped).length;
  persist(d,skip?`跳过第 ${answered} 题`:`回答第 ${answered} 题`);
  if(answered>=QUESTIONS)ivSummary(d);else ivAsk(d);
}
function roundsText(iv){
  return (iv.rounds||[]).map((r,i)=>{const ans=(r.open||[]).filter(x=>x.a);return ans.length?`第 ${i+1} 次整理后他补充回答：\n`+ans.map(x=>`Q：${x.q}\nA：${x.a}`).join("\n\n"):""}).filter(Boolean).join("\n\n");
}
async function ivSummary(d){
  const sample=await getSample();if(!sample){S.sample=null;render();return}
  const key="iv-"+d.id;
  const iv=d.interview;
  iv.qa=(iv.qa||[]).filter(x=>x.a!=null||x.skipped);
  if(iv.summary&&!iv.rounds)iv.rounds=[{summary:iv.summary,at:iv.summaryAt,open:[]}];
  iv.rounds=iv.rounds||[];
  S.busy[key]="sum";S.err[key]=null;render();
  const extra=roundsText(iv);
  const maxOpen=iv.enough?0:([3,2,0][iv.rounds.length]||0);
  const prompt=`你在帮一个人整理他对一个决定的思路。用简体中文，语气可以有一点调侃，但内容要清楚、诚实。你可以给出自己的看法和倾向，但最终决定由他做。

决定资料：
${brief(d)}

问答：
${qaText(iv.qa)}
${extra?"\n"+extra+"\n":""}
只输出一个 JSON 对象，不要任何其他文字或代码块标记，格式：
{"summary":"纯文字（不要 markdown 符号），分四段，每段用【】标题开头并换行：【你真正在乎的】【每个选项的关键取舍】【你的回答里透露的担心或矛盾】【我的看法】（直说你的结论：根据他说的，你倾向哪个选项、为什么、成立的前提或要先确认的事；可以毒舌但要公道，最后一句提醒决定还是他自己做），总共 450 字以内${extra?"；要把他补充的回答整合进去":""}","open":[${maxOpen?`"还没想清楚、而且真的会影响这个决定的地方，每条写成一个具体问句，最多 ${maxOpen} 条；小细节、问过的、他补充回答已经解决的都不要列；如果他的回答已经足够做决定就给空数组"`:""}]}${maxOpen?"":"\n这是最后一次整理，open 必须是空数组。"}`;
  try{
    const r=await sample.json(prompt,{cache:false});
    const summary=String(r&&r.summary||"").trim();if(!summary)throw{message:"没生出总结"};
    const open=Array.isArray(r.open)?r.open.map(q=>String(q).trim()).filter(Boolean).slice(0,maxOpen):[];
    const at=nowISO();
    iv.rounds.push({summary,at,open:open.map(q=>({q}))});
    iv.summary=summary;iv.summaryAt=at;S.busy[key]=null;
    persist(d,iv.rounds.length>1?`Claude 重新整理思路（第 ${iv.rounds.length} 次）`:"Claude 出了思路整理");
  }catch(e){S.busy[key]=null;S.err[key]=sampleErr(e);render()}
}
function ivResummary(d){
  const iv=d.interview;const last=iv.rounds[iv.rounds.length-1];const at=nowISO();let n=0;
  last.open.forEach((x,i)=>{const k=`op-${d.id}-${i}`;const v=(S.drafts[k]||"").trim();if(v&&!x.a){x.a=v;x.aAt=at;n++;delete S.drafts[k]}});
  if(!n&&!last.open.some(x=>x.a)){toast("至少回答一条再重新总结");return}
  if(n)persist(d,`回答了 ${n} 条还没想清楚的地方`);
  ivSummary(d);
}

/* ---------- seal & review ---------- */
async function seal(d){
  const dr=S.drafts["seal-"+d.id];
  if(dr.mode==="cond"){flushCondAdds(d,dr);return await sealRule(d,dr)}
  if(!dr.optionId){toast("先选一个");return}
  if(!dr.reason.trim()){toast("原因要写。不写原因，以后你只会骂自己");return}
  if(!dr.expect.trim()){toast("写一下你预计会发生什么，这是以后最有用的一句");return}
  const opt=d.options.find(o=>o.id===dr.optionId);
  if(!await ask(`封存锦囊：选“${opt.name}”。\n封存后这份决定就不能改了，只能复盘和追加备注。确定？`))return "cancel";
  const at=nowISO();
  d.final={optionId:dr.optionId,reason:dr.reason.trim(),whyNot:dr.whyNot.trim(),decidedAt:at};
  d.snapshot={expect:dr.expect.trim(),moods:[...dr.moods],moodNote:dr.moodNote.trim(),confidence:dr.confidence,reversible:dr.reversible,letter:dr.letter.trim(),at};
  d.status="decided";
  d.reviews=REVIEW_PLAN.map(p=>({key:p.key,label:p.label,due:addMonths(at,p.months)}));
  delete S.drafts["seal-"+d.id];
  S.freshSeal=d.id;
  persist(d,`封存锦囊，选了“${opt.name}”`);
  autoBackup("封存");ceremony("seal");
}
async function sealRule(d,dr){
  const conds={};let n=0;
  for(const o of d.options){const c=dr.conds[o.id];if(!c)continue;const items=c.items.map(i=>({id:i.id,text:i.text.trim()})).filter(i=>i.text);if(items.length){conds[o.id]={rule:c.rule,items};n++}}
  if(!n){toast("至少给一个选项写条件");return}
  if(!dr.checkBy){toast("要设最晚检查日期，不然这只是包装过的拖延");return}
  if(!dr.defaultOpt){toast("要设到期都没触发时的默认选项");return}

const KEY = "${key}";
const ROOT = "${ROOT_FOLDER_TITLE}";
const APP = "${APP_FOLDER_TITLE}";
const KEEP = 60; // 每日备份只留最近几天

function doPost(e) {
  const b = JSON.parse(e.postData.contents);
  if (b.key !== KEY) return out_({ ok: false, error: "key" });
  const f = folder_();
  if (b.action === "ping") return out_({ ok: true });
  if (b.action === "backup") {
    const name = "事后诸葛亮_备份_" + b.date + ".json";
    const old = f.getFilesByName(name); while (old.hasNext()) old.next().setTrashed(true);

    while (it.hasNext()) { const x = it.next(); if (/^事后诸葛亮_备份_\\d{4}-\\d{2}-\\d{2}\\.json$/.test(x.getName())) daily.push(x); }

  }

    const list = []; const it = f.getFiles();
    while (it.hasNext()) { const x = it.next(); if (/^事后诸葛亮_备份_/.test(x.getName())) list.push({ id: x.getId(), name: x.getName(), date: x.getDateCreated().toISOString() }); }

  if (b.action === "get") {
    const file = DriveApp.getFileById(b.id);
    const ps = file.getParents(); let inside = false; while (ps.hasNext()) if (ps.next().getId() === f.getId()) inside = true;
    if (!inside) return out_({ ok: false, error: "folder" });

  }

}
function sub_(parent, name) { const it = parent ? parent.getFoldersByName(name) : DriveApp.getFoldersByName(name); return it.hasNext() ? it.next() : (parent ? parent.createFolder(name) : DriveApp.createFolder(name)); }
function folder_() { return sub_(sub_(null, ROOT), APP); }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));

const BIOK="shzgl-bio";

function lkPassed(){
  lkFails=0;
  if(lkMode==="unlock"){S.unlocked=true;render();const el=L$("lock");el.classList.add("opening");setTimeout(()=>{el.classList.remove("opening");hideLock()},reduceMotion()?0:700)}

function lkWrong(){

  lkFail("密码不对");

async function lkCheck(){
  const L=S.settings.lock;if(!L)return;
  if(Date.now()<lkWaitUntil){lkFail("错太多次了，等一下再试");return}
  if(legacy()){
    if(await legacyHash(lkBuf,L.salt)!==L.hash){lkWrong();return}
    if(/^\d{4,6}$/.test(lkBuf)){const salt=b64(crypto.getRandomValues(new Uint8Array(16)));S.settings.lock=Object.assign({},L,{salt,hash:await pinHash(lkBuf,salt),len:lkBuf.length,after:L.after!=null?L.after:5,v:2});persistSettings()}

async function lkInput(n){
  if(n==="B"){lkBuf=lkBuf.slice(0,-1);lkDraw();return}
  if(lkBuf.length>=(isCheck()&&legacy()?32:6))return;
  lkBuf+=n;L$("lkMsg").textContent="";lkDraw();
  if(isCheck()&&!legacy()&&lkBuf.length===S.settings.lock.len)await lkCheck();

async function lkOk(){
  if(isCheck()){if(legacy()&&lkBuf)await lkCheck();return}

  if(lkBuf!==lkFirst){showLock("set1");lkFail("两次不一样，重新设定");return}
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const old=S.settings.lock;
  S.settings.lock={salt,hash:await pinHash(lkBuf,salt),len:lkBuf.length,after:old&&old.after!=null?old.after:5,at:nowISO(),v:2};
  persistSettings();S.unlocked=true;hideLock();render();toast("密码设好了");
}
